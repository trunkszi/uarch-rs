[package]
name = "uarch-macros"
autobenches = false
version.workspace = true
description = "Compile-time layout proofs, bit expressions and ISA multiversion macros."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
uarch-tiers = { workspace = true }

[dev-dependencies]
# Checkout-only integration bridges are omitted from published dependency graphs.
trybuild = { workspace = true }
uarch = { path = "../uarch", default-features = false }

[lints]
workspace = true

[[test]]
name = "e2e"
path = "tests/e2e.rs"

[[bench]]
name = "lib"
path = "benches/main.rs"
harness = false
